# Typecheck, lint, unit tests, build, then the frozen spec against a local Supabase stack.
# Branch protection on main requires this job (`ci`) and `spec-guard`.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Supabase CLI comes from the pinned devDependency (one source of truth for its version).
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy

      # supabase functions serve is added in the phase that creates the first Edge Function.

      - name: Frozen spec (database, unit, integration)
        run: npm run test:spec -- --integration
