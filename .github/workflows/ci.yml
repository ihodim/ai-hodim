# Typecheck, lint, unit tests, build, then the frozen spec against a local Supabase stack.
# Branch protection on main requires this job (`ci`) and `spec-guard`.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Supabase CLI comes from the pinned devDependency (one source of truth for its version).
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy

      # Serve Edge Functions only when a function folder other than _shared exists, and wait until it answers.
      - name: Serve Edge Functions
        run: |
          shopt -s nullglob
          fns=()
          for d in supabase/functions/*/; do
            name=$(basename "$d")
            [ "$name" != "_shared" ] && fns+=("$name")
          done
          if [ ${#fns[@]} -eq 0 ]; then
            echo "No Edge Functions yet"
            exit 0
          fi
          nohup npx supabase functions serve > functions.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "http://127.0.0.1:54321/functions/v1/${fns[0]}" || true)
            if [ "$code" = "200" ]; then
              echo "Edge Functions are up (${fns[*]})"
              exit 0
            fi
            sleep 2
          done
          echo "Edge Functions did not start"
          cat functions.log
          exit 1

      - name: Frozen spec (database, unit, integration)
        run: npm run test:spec -- --integration

      - name: Edge Function logs (on failure)
        if: failure()
        run: cat functions.log || true
