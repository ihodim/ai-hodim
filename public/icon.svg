<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed square so the same art works as "any" and "maskable" (glyph stays inside the 80% safe zone). -->
  <defs>
    <radialGradient id="glow" cx="256" cy="176" r="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB23F" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFB23F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#17123A"/>
  <circle cx="256" cy="176" r="124" fill="url(#glow)"/>
  <circle cx="256" cy="176" r="40" fill="#FFB23F"/>
  <rect x="226" y="246" width="60" height="150" rx="30" fill="#F4F0FF"/>
</svg>
